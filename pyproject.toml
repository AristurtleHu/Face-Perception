[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-perception"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pygame>=2.5",
  "Pillow>=10.0",
]

[project.scripts]
face-search = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "config", "resources", "runner", "stimuli", "trials"]
